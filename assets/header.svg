<svg width="100%" height="200" viewBox="0 0 1000 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#151E38" />
    </linearGradient>

    <!-- Wave 1: Soft Cyan/Blue -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.3" />
    </linearGradient>

    <!-- Wave 2: Vibrant Electric Flow -->
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00A8FF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Base Canvas filling top -->
  <path d="M 0 0 L 1000 0 L 1000 140 Q 750 180, 500 130 T 0 150 Z" fill="url(#headerGrad)" />

  <!-- Multi-Layer Fluid Waving Ribbons merging to #0D1117 -->
  <path d="M 0 130 C 250 190, 450 110, 700 160 C 850 190, 950 140, 1000 150 L 1000 200 L 0 200 Z" fill="url(#wave1)" />
  <path d="M 0 150 C 200 110, 400 190, 650 140 C 800 110, 920 170, 1000 160 L 1000 200 L 0 200 Z" fill="#0D1117" />
  <path d="M 0 140 C 220 180, 440 120, 680 165 C 820 190, 940 145, 1000 155 L 1000 160 C 940 150, 820 195, 680 170 C 440 125, 220 185, 0 145 Z" fill="url(#wave2)" />

  <!-- Main Headline Title -->
  <text x="500" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="3.5">ARIAN ESMALINASAB</text>

  <!-- Crisp Minimal Subtitle -->
  <text x="500" y="116" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94A3B8" letter-spacing="1.2">Electrical Engineering Student  <tspan fill="#00E5FF">•</tspan>  AI &amp; Machine Learning  <tspan fill="#00E5FF">•</tspan>  Systems Developer</text>
</svg>